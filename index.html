        body {
            background-color: #101b20;
            background-image: url("https://socrarius-tool.com/launcher/background.webp");
            color: #e0f7ff;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 105, 217, 0.3);
            border-bottom: 1px solid #00f2fe;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

       /* 🌸 左右レイアウトコンテナの調整 */
.main-layout {
    display: flex;
    gap: 30px; /* 少し広めに取ると見やすくなります */
    margin-top: 60px;
}

.left-content {
    /* 左側は残りの幅を全部使う設定 🌸 */
    flex: 1; 
    min-width: 0; /* 子要素のはみ出しによる押し出しを防止する魔法 */
    overflow-y: auto;
    height: calc(100vh - 80px);
}

.right-content {
    /* 右側のニュースエリアを固定 (例: 全体の45%に固定) 🌸 */
    width: 460px; 
    flex-shrink: 0; /* 絶対に縮まないように固定します */
    position: sticky;
    top: 60px;
    display: flex;
    flex-direction: column;
    gap: 0px;
}

/* 🌸 ニュース項目の調整：折り返しを許可する 🌸 */
.news-item {
    /* 以前の nowrap を廃止して、自然に折り返すようにします */
    white-space: normal; 
    word-wrap: break-word; /* 長い英単語があっても強制改行 */
    line-height: 1.5;
    margin-bottom: 2px;

    font-size: 14px;
    color: rgba(224, 247, 255, 0.8);
    border-left: 3px solid transparent;
    padding: 0px 0px;
    transition: all 0.3s ease;
    cursor: pointer;
    text-decoration: none;
    display: block;
}



        /* --- 既存のギャラリー等のスタイルは維持 --- */
        .section-title {
            background: #000; color: #00f2fe; padding: 10px 20px;
            margin: 20px 0 5px 0; font-size: 12px; font-weight: bold;
            border-left: 5px solid #00f2fe; letter-spacing: 3px;
        }

        /* --- スタイル追加 --- */
        .section-title2 {
            background: #000; color: #00f2fe; padding: 10px 20px;
            margin: 0px 0px 15px; font-size: 12px; font-weight: bold;
            border-left: 5px solid #00f2fe; letter-spacing: 3px;
        }


       /* --- ギャラリー（箱）の調整：間隔を半分に 🌸 --- */
.gallery {
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); /* 枠も少し小さく */
    gap: 8px;           /* 15pxから約半分に魔法！ */
    margin-bottom: 20px; 
    padding: 10px;      /* 中の余白も少しスリムに */
    border: 1px solid rgba(0, 242, 254, 0.15); 
    background: rgba(255, 255, 255, 0.02);
}

/* 🌸 アイコンサイズを2/3に（55px → 36px） 🌸 */
.icon-link img {
    width: 36px;        /* 55pxの2/3サイズです✨ */
    height: 36px; 
    object-fit: cover;
    border: 1px solid rgba(0, 242, 254, 0.3); 
    border-radius: 4px;
    transition: all 0.3s ease; 
    cursor: pointer;
}

/* ホバー時の光もサイズに合わせて微調整 🌸 */
.icon-link img:hover {
    transform: translateY(-2px);
    border-color: #00f2fe;
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.8); /* 光も少しシャープに */
    filter: brightness(1.2);
}

        /* 実用ランチャー側の小さいアイコンも同様に光らせる設定 */
        .utility-launcher .icon-link img {
            width: 35px; height: 35px;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }

        /* 🌸 ニュース項目：ホバーで光る魔法 🌸 */
        .news-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-size: 14px;
            color: rgba(224, 247, 255, 0.8);
            border-left: 3px solid transparent;
            padding-left: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .news-item:hover {
            color: #00f2fe;
            border-left: 3px solid #00f2fe;
            background: rgba(0, 242, 254, 0.05);
            padding-left: 15px;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }

        .loading {
            opacity: 0.6;
            font-size: 12px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 0.7; }
            100% { opacity: 0.2; }
        }
    </style>

    async function fetchNews() {
    const listContainer = document.getElementById('news-list');
    
    // 🌸 【ここが今回の魔法！】31パターンからランダムで英文を表示！
    const totalPatterns = typeof cyberAlerts !== 'undefined' ? cyberAlerts.length : 31;
    const randomIndex = Math.floor(Math.random() * totalPatterns);
    const randomMessage = cyberAlerts ? cyberAlerts[randomIndex] : "LOADING SYSTEM...";
    
    // 改行（\n）をブラウザで綺麗に表示（<br>に置換）して、サイバーなフォントで配置
    listContainer.innerHTML = `
        <div class="loading" style="color: #cc66ff; font-family: monospace; white-space: pre-line; line-height: 1.4; font-size: 11px; text-align: left; padding: 5px; border-left: 2px dashed #bc00dd;">
            ${randomMessage}
        </div>`;

    try {
        const targetUrl = 'https://news.google.com/rss/headlines?hl=ja&gl=JP&ceid=JP:ja';
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl, {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
        });

        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

        const data = await res.json();
        if (!data || !data.contents) throw new Error("Proxy returned no content");

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");

        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) throw new Error("XML Parse Error");

        const items = xmlDoc.querySelectorAll("item");
        if (items.length === 0) throw new Error("No items found");

        let html = "";
        const maxItems = Math.min(items.length, 12);

        for (let i = 0; i < maxItems; i++) {
            const item = items[i];
            let title = item.querySelector("title")?.textContent || "No Title";
            const link = item.querySelector("link")?.textContent || "#";

            title = title.split(' - ')[0].trim();

            html += `
                <a href="${link}" target="_blank" class="news-item" title="${title}">
                    ▶ ${title}
                </a>`;
        }

        listContainer.innerHTML = html;

    } catch (e) {
        console.error("News Fetch Error:", e);
        listContainer.innerHTML = `
            <div style="color:#ff6666; font-size:12px; padding:10px; line-height:1.5;">
                [SYSTEM ALERT] NEWS FEED OFFLINE<br>
                REASON: ${e.message}<br>
                <span style="font-size:11px; opacity:0.7;">SYSTEM WILL RETRY IN 10 SECONDS</span>
            </div>`;
        
        setTimeout(fetchNews, 10000);
    }
}

// 初回実行
window.onload = () => {
    fetchNews();
    // 10分ごとに更新（15分→10分に短縮）
    setInterval(fetchNews, 10 * 60 * 1000);
};
