<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Socrarius HP LINK</title>
    <style>
        body {
            background: rgba(0, 5, 15, 0.9);
            color: #e0f7ff;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌸 上部固定バナー */
        .system-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 40px;
            background: rgba(0, 105, 217, 0.3);
            border-bottom: 1px solid #00f2fe;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

       /* 🌸 左右レイアウトコンテナの調整 */
.main-layout {
    display: flex;
    gap: 30px; /* 少し広めに取ると見やすくなります */
    margin-top: 60px;
}

.left-content {
    /* 左側は残りの幅を全部使う設定 🌸 */
    flex: 1; 
    min-width: 0; /* 子要素のはみ出しによる押し出しを防止する魔法 */
    overflow-y: auto;
    height: calc(100vh - 80px);
}

.right-content {
    /* 右側のニュースエリアを固定 (例: 全体の45%に固定) 🌸 */
    width: 460px; 
    flex-shrink: 0; /* 絶対に縮まないように固定します */
    position: sticky;
    top: 60px;
    display: flex;
    flex-direction: column;
    gap: 0px;
}

/* 🌸 ニュース項目の調整：折り返しを許可する 🌸 */
.news-item {
    /* 以前の nowrap を廃止して、自然に折り返すようにします */
    white-space: normal; 
    word-wrap: break-word; /* 長い英単語があっても強制改行 */
    line-height: 1.5;
    margin-bottom: 2px;

    font-size: 14px;
    color: rgba(224, 247, 255, 0.8);
    border-left: 3px solid transparent;
    padding: 0px 0px;
    transition: all 0.3s ease;
    cursor: pointer;
    text-decoration: none;
    display: block;
}



        /* --- 既存のギャラリー等のスタイルは維持 --- */
        .section-title {
            background: #000; color: #00f2fe; padding: 10px 20px;
            margin: 20px 0 5px 0; font-size: 12px; font-weight: bold;
            border-left: 5px solid #00f2fe; letter-spacing: 3px;
        }

        /* --- スタイル追加 --- */
        .section-title2 {
            background: #000; color: #00f2fe; padding: 10px 20px;
            margin: 0px 0px 15px; font-size: 12px; font-weight: bold;
            border-left: 5px solid #00f2fe; letter-spacing: 3px;
        }


       /* --- ギャラリー（箱）の調整：間隔を半分に 🌸 --- */
.gallery {
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); /* 枠も少し小さく */
    gap: 8px;           /* 15pxから約半分に魔法！ */
    margin-bottom: 20px; 
    padding: 10px;      /* 中の余白も少しスリムに */
    border: 1px solid rgba(0, 242, 254, 0.15); 
    background: rgba(255, 255, 255, 0.02);
}

/* 🌸 アイコンサイズを2/3に（55px → 36px） 🌸 */
.icon-link img {
    width: 36px;        /* 55pxの2/3サイズです✨ */
    height: 36px; 
    object-fit: cover;
    border: 1px solid rgba(0, 242, 254, 0.3); 
    border-radius: 4px;
    transition: all 0.3s ease; 
    cursor: pointer;
}

/* ホバー時の光もサイズに合わせて微調整 🌸 */
.icon-link img:hover {
    transform: translateY(-2px);
    border-color: #00f2fe;
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.8); /* 光も少しシャープに */
    filter: brightness(1.2);
}

        /* 実用ランチャー側の小さいアイコンも同様に光らせる設定 */
        .utility-launcher .icon-link img {
            width: 35px; height: 35px;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #345485; }

        /* 🌸 ニュース項目：ホバーで光る魔法 🌸 */
        .news-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-size: 14px;
            color: rgba(224, 247, 255, 0.8);
            border-left: 3px solid transparent;
            padding-left: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .news-item:hover {
            color: #00f2fe;
            border-left: 3px solid #00f2fe;
            background: rgba(0, 242, 254, 0.05);
            padding-left: 15px;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }

        .loading {
            opacity: 0.6;
            font-size: 12px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 0.7; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body>

        <div class="section-title" id="section3">SPORTS</div>

   <div class="right-content">
        <div class="section-title2">SYSTEM CALL: MARKET MONITOR</div>   
        <div id="market-terminal" style="background: rgba(0, 10, 5, 0.6); border: 1px solid #33ff66; padding: 10px; margin-bottom: 15px; font-family: monospace; font-size: 13px; color: #33ff66; border-radius: 4px;">
            <div id="market-list" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <div class="loading">Scanning Market Signals...</div>
            </div>
        </div>

        <div class="section-title2">SYSTEM CALL: TOP HEADLINES</div>   
        <div id="news-terminal">
            <div id="news-list" class="news-container">
                <div class="loading">Scanning Global News Waves...</div>
            </div>
        </div>
    </div>

<script>
    // 🌸 追加：株価と為替（ドル円・日経平均・ダウ）を一瞬でパッと取得する魔法
    async function fetchMarketData() {
        const marketContainer = document.getElementById('market-list');
        
        try {
            // Yahoo Financeの公式パブリック軽量API（プロキシ不要・爆速）
            // USD/JPY(ドル円), ^N225(日経平均), ^DJI(NYダウ)
            const targetUrl = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=JPY=X,^N225,^DJI';
            
            const res = await fetch(targetUrl, { cache: 'no-store' });
            if (!res.ok) throw new Error("Market API Error");
            
            const data = await res.json();
            const quotes = data.quoteResponse?.result;
            
            if (!quotes || quotes.length === 0) throw new Error("No Market Data");
            
            // データをそれぞれのシンボルごとに整理
            const usdjpy = quotes.find(q => q.symbol === 'JPY=X');
            const nikkei = quotes.find(q => q.symbol === '^N225');
            const dow = quotes.find(q => q.symbol === '^DJI');
            
            // 前日比によって色を変える演出（プラスなら緑/そのまま、マイナスなら赤っぽくなど、今回はサイバー感優先）
            const getPriceHTML = (label, quote, isCurrency = false) => {
                if (!quote) return `<div>${label}: N/A</div>`;
                const price = quote.regularMarketPrice;
                const changePercent = quote.regularMarketChangePercent;
                const sign = changePercent >= 0 ? "+" : "";
                const color = changePercent >= 0 ? "#33ff66" : "#ff4444"; // プラスは緑、マイナスは赤
                
                // ドル円なら小数点2桁、株価ならカンマ区切り
                const formattedPrice = isCurrency ? price.toFixed(2) : Math.floor(price).toLocaleString();
                
                return `
                    <div style="flex: 1; min-width: 100px; padding: 4px 8px; background: rgba(0, 30, 10, 0.4); border-left: 3px solid ${color};">
                        <span style="font-size: 11px; opacity: 0.7; block;">${label}</span><br>
                        <strong style="font-size: 14px;">${isCurrency ? '¥' : ''}${formattedPrice}</strong> 
                        <span style="color: ${color}; font-size: 11px;">(${sign}${changePercent.toFixed(2)}%)</span>
                    </div>`;
            };
            
            let html = "";
            html += getPriceHTML("USD/JPY", usdjpy, true);
            html += getPriceHTML("NIKKEI 225", nikkei, false);
            html += getPriceHTML("NY DOW", dow, false);
            
            marketContainer.innerHTML = html;
            
        } catch (e) {
            console.error("Market Fetch Error:", e);
            marketContainer.innerHTML = `<div style="color:#ffaa00; font-size:11px;">[MARKET DATA TEMPORARILY OFFLINE]</div>`;
        }
    }

    async function fetchNews() {
        const listContainer = document.getElementById('news-list');
        listContainer.innerHTML = '<div class="loading">Scanning Global News Waves...</div>';

        try {
            const targetUrl = 'https://news.google.com/rss/headlines?hl=ja&gl=JP&ceid=JP:ja';
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
            const res = await fetch(proxyUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                cache: 'no-store'
            });

            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

            const data = await res.json();
            if (!data || !data.contents) throw new Error("Proxy returned no content");

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(data.contents, "text/xml");

            const parseError = xmlDoc.querySelector('parsererror');
            if (parseError) throw new Error("XML Parse Error");

            const items = xmlDoc.querySelectorAll("item");
            if (items.length === 0) throw new Error("No items found");

            let html = "";
            const maxItems = Math.min(items.length, 12);

            for (let i = 0; i < maxItems; i++) {
                const item = items[i];
                let title = item.querySelector("title")?.textContent || "No Title";
                const link = item.querySelector("link")?.textContent || "#";

                title = title.split(' - ')[0].trim();

                html += `
                    <a href="${link}" target="_blank" class="news-item" title="${title}">
                        ▶ ${title}
                    </a>`;
            }

            listContainer.innerHTML = html;

        } catch (e) {
            console.error("News Fetch Error:", e);
            listContainer.innerHTML = `
                <div style="color:#ff6666; font-size:12px; padding:10px; line-height:1.5;">
                    [SYSTEM ALERT] NEWS FEED OFFLINE<br>
                    REASON: ${e.message}<br>
                    <span style="font-size:11px; opacity:0.7;">SYSTEM WILL RETRY IN 10 SECONDS</span>
                </div>`;
            
            setTimeout(fetchNews, 10000);
        }
    }

    // 初回実行
    window.onload = () => {
        fetchMarketData(); // 🌸 株価をフェッチ！
        fetchNews();       // ニュースをフェッチ！
        
        // 10分ごとに両方更新
        setInterval(() => {
            fetchMarketData();
            fetchNews();
        }, 10 * 60 * 1000);
    };
</script>
